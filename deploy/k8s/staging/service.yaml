apiVersion: v1
kind: Service
metadata:
  name: aspnetapp
  namespace: aspnetapp-staging
  labels:
    app.kubernetes.io/name: aspnetapp
    app.kubernetes.io/part-of: dotnet-aspnetapp

spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: aspnetapp
    app.kubernetes.io/part-of: dotnet-aspnetapp

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080